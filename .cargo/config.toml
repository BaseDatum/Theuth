# audiopus_sys (opus, design doc 43) bundles a libopus whose CMakeLists predates
# cmake 4's minimum; this lets cmake ≥ 4 configure it. Drop when audiopus_sys updates.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# gemm-common 0.19 (candle → decision model) writes `.8h` half-precision NEON asm in functions without
# `#[target_feature(enable = "fp16")]`; rustc ≥ 1.98 rejects that unless the target enables fp16
# ("instruction requires: fullfp16"). Every aarch64 Linux we ship to (Graviton2+, Ampere, Pi 5, Apple VMs)
# has it. Drop when gemm-common carries the attribute.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16", "-C", "split-debuginfo=unpacked"]
# GNU ld needs >11 GB for the debug test binaries on arm64 and gets OOM-killed on a 15 GiB box; link with
# the LLD rustc ships instead (scripts/aarch64-linux-lld-cc.sh explains; path relative to the repo root) and keep
# DWARF out of the rlibs (split-debuginfo=unpacked): with both, two concurrent debug links fit in ~1 GB each.
linker = "scripts/aarch64-linux-lld-cc.sh"

# theuth: crates.io libsqlite3-sys 0.36.0 with SQLCipher compiled against BoringSSL
# (boring-sys) instead of OpenSSL/CommonCrypto. See build.rs, sqlcipher/boringssl_evp_mac.h
# and the `[patch.crates-io]` entry in the workspace Cargo.toml. Upstream's normalization
# preamble and `bundled-sqlcipher-vendored-openssl` feature (dead without OpenSSL) are removed.

[package]
edition = "2021"
name = "libsqlite3-sys"
version = "0.36.0"
authors = ["The rusqlite developers"]
build = "build.rs"
links = "sqlite3"
exclude = ["**/*.sh"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Native bindings to the libsqlite3 library"
readme = "README.md"
keywords = [
    "sqlite",
    "sqlcipher",
    "ffi",
]
categories = ["external-ffi-bindings"]
license = "MIT"
repository = "https://github.com/rusqlite/rusqlite"

[features]
buildtime_bindgen = [
    "bindgen",
    "pkg-config",
    "vcpkg",
]
bundled = [
    "cc",
    "bundled_bindings",
]
bundled-sqlcipher = [
    "bundled",
    "boring-sys",
]
bundled-windows = [
    "cc",
    "bundled_bindings",
]
bundled_bindings = []
column_metadata = []
default = ["min_sqlite_version_3_34_1"]
in_gecko = []
loadable_extension = [
    "prettyplease",
    "quote",
    "syn",
]
min_sqlite_version_3_34_1 = [
    "pkg-config",
    "vcpkg",
]
preupdate_hook = ["buildtime_bindgen"]
session = [
    "preupdate_hook",
    "buildtime_bindgen",
]
sqlcipher = []
unlock_notify = []
wasm32-wasi-vfs = []
with-asan = []

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"

[[test]]
name = "sqlcipher_boringssl"
path = "tests/sqlcipher_boringssl.rs"

# Same source the rest of the tree resolves (libsignal); the workspace patches it to the
# skymoore/boring fork that emits `cargo:include`, read by build.rs as DEP_BORINGSSL_INCLUDE.
[dependencies.boring-sys]
git = "https://github.com/signalapp/boring"
tag = "signal-v5.0.2"
optional = true

[build-dependencies.bindgen]
version = "0.72"
features = ["runtime"]
optional = true
default-features = false

[build-dependencies.cc]
version = "1.2.27"
optional = true

[build-dependencies.pkg-config]
version = "0.3.19"
optional = true

[build-dependencies.prettyplease]
version = "0.2.20"
optional = true

[build-dependencies.quote]
version = "1.0.36"
optional = true
default-features = false

[build-dependencies.syn]
version = "2.0.87"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]
optional = true

[build-dependencies.vcpkg]
version = "0.2.15"
optional = true

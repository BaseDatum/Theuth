[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.8.3"
edition = "2024"
publish = false

[workspace.dependencies]
# Knowledge bundle (design doc 10): OKF v0.1 format, and local-only git history via gitoxide
# (no default features: no network, no interrupt/parking_lot; `parallel` = Arc-based sharing so the handle is Send; skills clone/pull stay on the user's git, 04 §2.2).
okf = "=0.1.0-alpha.1"
gix = { version = "0.87", default-features = false, features = ["revision", "blob-diff", "sha1", "parallel"] }
runtime = { path = "crates/runtime" }
models = { path = "crates/models" }
markdown = { path = "crates/markdown" }
oauth = { path = "crates/oauth" }
tools = { path = "crates/tools" }
knowledge = { path = "crates/knowledge" }
search = { path = "crates/search" }  # shared fuzzy matching/snippet/page envelope (design doc 49 §4.1)
agent = { path = "crates/agent" }
rpc = { path = "crates/rpc" }
tui = { path = "crates/tui" }
cursor = { path = "crates/cursor" }
signal = { path = "crates/signal" }
slack = { path = "crates/slack" }
acp = { path = "crates/acp" }
web = { path = "crates/web" }
search-providers = { path = "crates/search-providers" }
browser = { path = "crates/browser" }
firecrawl-native = { path = "crates/firecrawl-native" }
scrape = { path = "crates/scrape" }
routes = { path = "crates/routes" }
computer = { path = "crates/computer" }
surface = { path = "crates/surface" }
link = { path = "crates/link" }
nodes = { path = "crates/nodes" }
a2a = { path = "crates/a2a" }  # A2A network boundary plugin (50 §6)
schedule = { path = "crates/schedule" }
artifact = { path = "crates/artifact" }
app = { path = "crates/app" }  # interactive OpenUI apps: publish, app RPC, one-press tool bridge (46)
secrets = { path = "crates/secrets" }  # secrets vault (37)
update = { path = "crates/update" }  # self-update from the release bucket (39)
voice = { path = "crates/voice" }  # read replies aloud: Pocket TTS in-process (43)
meeting = { path = "crates/meeting" }  # meeting recorder: process tap + VPIO mic, three Opus tracks (53)
# Meetings (design doc 53): `rtrb` = lock-free rings between the capture threads and the encoder;
# `ogg` = RFC 7845 Opus-in-Ogg pages; `coreaudio-rs` = the VoiceProcessingIO mic unit (0.13 is
# what `cpal` already pins — 0.12 would duplicate `objc2-audio-toolbox`); `objc2-core-audio` =
# the process list (`kAudioHardwarePropertyProcessObjectList`; flexaudio has no enumeration);
# `objc2-core-foundation` = its bundle-id CFStrings; `objc2-av-foundation` = the non-prompting mic
# TCC probe; `libc` = `proc_name` and `statvfs`.
rtrb = "0.3"  # 53
ogg = "0.9"  # 53
coreaudio-rs = "0.13"  # 53
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }  # 53
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }  # 53
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }  # 53
libc = "0.2"  # 53
# Phase 4 (04-post): pyannote segmentation-3.0 + wespeaker embeddings run on `ort` directly (the
# `pyannote-rs` 0.3.4 crate does not compile against rc.13 — 04 §10); `knf-rs` = kaldi fbank
# features for wespeaker (cmake, as `ptts`); `hound` = the WAV the review pane plays.
knf-rs = "0.3"  # 53
hound = "3.5"  # 53
# Voice (design doc 43): `ptts` = pure-Rust Pocket TTS (`sp` = SentencePiece `tokenizer.model`,
# the file the checkpoint ships; needs cmake); `opus` = libopus for 80 ms packets on the wire.
# crates.io 0.2.3 predates `ptts::synth::Synth` (the streaming API 43 §2.1 relies on); the rev is
# main on 2026-09-16, still 0.2.3 + xn 0.2.4 from crates.io. Drop the git ref when 0.2.4 ships.
ptts = { git = "https://github.com/gradium-ai/xn-ptts", rev = "5d50b5209ff9bbd7d3bac5a26f3c3bc1934fca89", features = ["sp"] }
xn = "0.2.4"  # ptts's tensor library; only `set_num_threads` is called directly
opus = "0.3"
# Voice notes (design doc 45): `parakeet-rs` = Parakeet TDT speech-to-text on ONNX Runtime. `load-dynamic`, not
# pyke's static build: that archive carries protobuf 3.21 with default visibility, `sentencepiece` (ptts) carries
# protobuf-lite 3.14, and one process cannot hold both — the TTS load aborts. The dylib lives beside the checkpoint.
parakeet-rs = { version = "0.3", default-features = false, features = ["cpu", "load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }  # parakeet-rs's pin; only `init_from` is called
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "ogg", "wav", "pcm", "mkv"] }  # demux/decode inbound voice notes (45 §0.5); Opus packets go to `opus`
rubato = "0.16"  # resample inbound audio to the model's 16 kHz (45 §0.5)
mp3lame-encoder = "0.2"  # outbound clips: MP3 24 kHz mono 48 kbit/s, the one container every client plays (45 §0.4)
parking_lot = "0.12"  # the STT model slot: locked only inside `spawn_blocking`, no poisoning to unwrap
# Dictation (design doc 54): the daemon owns the mic and gates a streaming Nemotron session with TEN-VAD.
flexaudio = "0.2"  # 54 §0.2: native default-input capture, 48 kHz mono f32 on a dedicated thread (`voice::mic`); 0.2.0 is the only published release
wavekat-vad = { version = "0.1", default-features = false, features = ["ten-vad"] }  # 54 §0.4: TEN-VAD on the same `ort` dylib, 256-sample frames (`voice::vad`); model fetched at build unless `TEN_VAD_MODEL_PATH`
# Update (design doc 39): semver compare, the updater plugin's own minisign verifier, tar for the
# single-file CLI payload. The desktop side is tauri-plugin-updater below.
semver = "1"
minisign-verify = "0.2"
tar = "0.4"
# Artifacts (design doc 35): in-process Typst for markdown/Typst → PDF, page render for the model's
# preview; `csv` parses table artifacts; `resvg` (already transitive via typst) rasterises SVG artifacts.
# typst-as-lib's kit features = embedded fonts + system font scan through typst-kit; `typst-layout`
# owns `PagedDocument` (not re-exported by `typst` 0.15).
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-render = "0.15"
resvg = "0.47"
csv = "1.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
# Streaming markdown: committed blocks + pending tail (design doc 03).
mdstream = { version = "0.3", features = ["sync"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# json-render fences (design doc 30 §4): repair model-authored JSON before serde; same algorithm as the desktop's `jsonrepair`.
jsonrepair-rs = "0.2"
# App argument re-check before invocation (design doc 46 §4); no `$ref` retrieval over http/file.
jsonschema = { version = "0.33", default-features = false }
# OAuth login (design doc 05). reqwest major must match rmcp's.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "http2", "stream"] }
# Upstream master includes PR #388; not yet in a crates.io release (21 §2.1).
slack-morphism = { git = "https://github.com/abdolence/slack-morphism-rust", rev = "e2a4b014b2bedc82c1ccfeae1706e0f2d6a184a3", features = ["hyper"] }
sha2 = "0.10"
nucleo = "0.5"  # fzf/helix fuzzy scoring for session search (design doc 26)
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
figment = { version = "0.10", features = ["yaml", "env"] }
serde_yaml = "0.9"
notify = "8"
kameo = "0.22"
kameo_actors = "0.8"
genai = { version = "0.7.0-beta.24-WIP", features = ["bedrock-sigv4"] }
aws-config = "1"
aws-types = "1"
brush-core = "0.5"
brush-builtins = "0.2"
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
iocraft = "0.9"
gray_matter = "0.3"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "chrono-impl", "serde-json-impl"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
nix = { version = "0.31", features = ["signal"] }
glob = "0.3"
tower = { version = "0.5", features = ["util"] }
# Cursor agent backend (crates/cursor): Connect-RPC protobuf, pure-Rust protoc.
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.9"
bytes = "1"
h2 = "0.4"
# Web search/fetch (design doc 16): one HTML parser for markdown and text; wiremock for provider contract tests.
html-to-markdown-rs = { version = "3.12", default-features = false }
url = "2"
wiremock = "0.6"
http = "1"
flate2 = "1"  # 38: gzip sitemaps
# Documents as Markdown (design doc 20): PDF/Office/ODF/RTF/EPUB, pure Rust, no external binaries.
anydoc = "0.2"
# Python runtime (design doc 08): pool of `monty` worker subprocesses.
monty-pool = "0.0.23"
monty-types = "0.0.23"
monty-fs = "0.0.23"
# The worker lives inside `theuth` (`t subprocess`, design doc 08 §9): the protocol state
# machine + interpreter, and the limiting allocator it requires as the global allocator.
monty-proto = { version = "0.0.23", features = ["worker"] }
monty-alloc = { version = "0.0.23", features = ["exit-code"] }
regex = "1"
# PTY jobs (design doc 22): wezterm's pty layer and a vt100 screen for the model.
portable-pty = "0.9"
vt100 = "0.16"
# grep tool (12 §10): ripgrep's walker and matcher crates
ignore = "0.4.33"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Signal channel (design doc 09). crates.io `presage` is an unrelated crate; the
# rev is the one jarvis reviewed and ran. `cdsi` = E.164→ACI fallback (09 §5.2).
presage = { git = "https://github.com/whisperfish/presage", rev = "c363731038acf176ab6b5ee0600d7de85f8a2da8", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "c363731038acf176ab6b5ee0600d7de85f8a2da8" }
qrcode = { version = "0.14", default-features = false }
# Snap compaction frames (design doc 13 §0.4): 8-bit grayscale encode only; not `image`.
png = "0.17"
# Agent Client Protocol (design doc 06): external harnesses as subagents, `t --acp`.
# 2.x is a rewrite; pinned exactly, only the v1 schema module is used (06 §7).
agent-client-protocol = "=2.1.0"
# Image input (design doc 17): OS clipboard image read — bracketed paste is text-only.
# `image-data` pulls `image` with minimal features; we encode with `png` ourselves.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Attachment mime check (17 §3.1); already in the tree via genai.
mime_guess = "2"
# Embedded headless browser (design doc 23 §3.3, §9): obscura's agent tool layer, in-process.
# Fork `main` = tag v0.2.2 + `tools()`/`call_tool()` (23 §3.3) + the
# `browser_network_capture` tool (44 §3.1: on_response exchanges with request headers and
# bodies, documents and fetch/XHR only) + iframe realms carrying deno_core's context-state
# slots (an unhandled promise rejection inside a frame was a process-killing SIGSEGV).
# `stealth` = wreq/BoringSSL TLS fingerprint (needs cmake + clang to build); `render` =
# layout/paint for `browser_screenshot`. obscura-js only for the main-thread warmup.
obscura-mcp = { git = "https://github.com/skymoore/obscura", branch = "main", features = ["stealth", "render"] }
obscura-js = { git = "https://github.com/skymoore/obscura", branch = "main", features = ["stealth", "render"] }
iana-time-zone = "0.1"
psl = "2"  # routes (44): registrable domain
# unjar (design doc 23 §7): read the user's real cookies from local browser
# profiles (Chrome/Firefox/Edge/Brave/Chromium/Safari) so the agent can act as
# the signed-in user. Library only (no CLI). Fork `main` = upstream + one commit
# dropping rusqlite 0.40→0.38 so its libsqlite3-sys is 0.36, the version presage
# and sqlx already link (Cargo allows only one `links = "sqlite3"`).
unjar = { git = "https://github.com/skymoore/unjar", branch = "main", default-features = false }
# Computer control (design doc 27): xcap enumerates displays (and captures off-macOS;
# macOS uses `/usr/sbin/screencapture`, 27 §0.4); enigo simulates input on one thread;
# `image` is xcap's dependency, used for resize + PNG (ends 13 §0.4's avoidance).
xcap = { version = "0.9", default-features = false }
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
# Desktop menubar app (design doc 25): Tauri 2 shell around the RPC client; the daemon is the
# bundled `theuth` sidecar started on a pty (design doc 18). Plugins replace hand-written
# NSStatusItem / LaunchServices / NSUserNotification glue.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }  # macos-private-api: the transparent island (53 decision 8)
tauri-build = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"  # 39 §3.3: the .app swaps itself at quit
# Meetings island (design doc 53 decision 8, 03 §1): `tauri-nspanel` swizzles the island window into a
# non-activating `NSPanel` (old `cocoa`/`objc` crates; they coexist with objc2); `objc2-app-kit` for
# `NSScreen.safeAreaInsets` (notch placement) and the screen-parameters notification.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }  # 53
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSApplication"] }  # 53
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSGeometry", "NSArray", "block2", "objc2-core-foundation"] }  # 53
# Link (design doc 31): the harness pairs with phones through a stateless relay.
# snow = Noise handshakes (NK registration, IKpsk2 pairing, IK sessions; suite
# 25519_AESGCM_SHA256 so the device side is pure WebCrypto). tokio-tungstenite =
# harness → relay WebSocket; axum/axum-server/tower-http = the `theuth-relay` server
# (crates/relay); dashmap = its id → uplink table.
snow = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
dashmap = "6"
# Agent communication (design doc 50 §3.1): the official A2A Rust SDK, exact pre-1.0 pins the user
# accepted with an explicit maturity waiver; the conformance/interop gates of 50 §12 still apply.
# Published names carry `-lf`; the future local plugin crate is `a2a`, so the core SDK is aliased
# `a2a-types` (imports are `a2a_types::…`). Default `rustls-tls` = aws-lc-rs, the provider
# `theuth::main` installs. Both pull `a2a-pb` (prost/pbjson): the HTTP wire is ProtoJSON.
a2a-types = { package = "a2a-lf", version = "=0.3.1" }
a2a-client = { package = "a2a-client-lf", version = "=0.2.5" }
a2a-server = { package = "a2a-server-lf", version = "=0.4.4" }
rand = "0.9"
# Schedule (design doc 34): croner = cron parsing + next occurrence in a chrono TimeZone
# (local time, DST-correct) + `describe()`; humantime = `every:` durations.
croner = { version = "4", features = ["chrono"] }
humantime = "2"
# secrets vault (37): XChaCha20-Poly1305 file, key in the OS keychain (or a 0600 file),
# values zeroized in memory, one aho-corasick pass scrubs tool output, rpassword for `--secret-set`.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }  # secrets vault (37)
chacha20poly1305 = "0.10"  # secrets vault (37)
zeroize = "1"  # secrets vault (37)
aho-corasick = "1"  # secrets vault (37)
rpassword = "7"  # secrets vault (37)

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# In-repo dependency patches (design doc §1.3). Each entry names the fork branch
# and the reason; drop when upstream ships the change.
[patch.crates-io]
# brush-core: `ExecutionParameters::on_spawn` hook reporting (pid, pgid) of every
# spawned external command, so the shell tool can `killpg` orphans on timeout.
# Branch `on-spawn-0.5` = tag brush-core-v0.5.0 + one commit. brush-parser is
# patched to the same commit (identical to crates.io 0.4.0) because brush-core
# depends on it by path inside the fork; without this entry cargo would build two
# brush-parser copies and brush-builtins' AST types would mismatch brush-core's.
brush-core = { git = "https://github.com/skymoore/brush", branch = "on-spawn-0.5" }
brush-parser = { git = "https://github.com/skymoore/brush", branch = "on-spawn-0.5" }
# iocraft: `TextInput.newline_modifiers` so a multiline input inserts a newline
# only on Shift+Enter and leaves plain Enter to the parent (submit),
# `TerminalEvent::Paste` forwarding crossterm's bracketed-paste events, and
# `TextInput.mask` for password fields (37 §5). Branch `mask-0.9` =
# tag iocraft-v0.9.1 + three commits (also derives `Default` for `KeyModifiers`).
iocraft = { git = "https://github.com/skymoore/iocraft", branch = "mask-0.9" }
# curve25519-dalek: libsignal (under presage) must build against Signal's fork;
# only presage's tree resolves this crate, so nothing else is affected.
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
# anydoc / pdf-inspector: identical to crates.io 0.2.4 / 1.15.0; the tags are
# used because some networks' proxies refuse static.crates.io downloads of these
# crates (and of lopdf 0.44's `aes 0.9`, hence 1.15.0 → lopdf 0.42). Drop when that clears.
anydoc = { git = "https://github.com/firecrawl/anydoc", tag = "v0.2.4" }
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector", tag = "v1.15.0" }
# obscura vendors corrected taffy/cosmic-text under `vendor/` and patches them in its own
# workspace; a git dependency's patches do not propagate, so we point at the same copies (23 §2).
taffy = { git = "https://github.com/skymoore/obscura", branch = "main" }
cosmic-text = { git = "https://github.com/skymoore/obscura", branch = "main" }
# genai: preserve ToolResponse.images (23 §5), plus upstream Bedrock profile selection,
# credential refresh, region and explicit-profile isolation fixes (02 §2.2).
genai = { git = "https://github.com/skymoore/rust-genai", branch = "main" }
# btls-sys (wreq's BoringSSL, under obscura's stealth): `links = "btls"` instead of "boringssl" so
# it can coexist with libsignal's boring-sys, and `prefix-symbols` (every export renamed
# `btls_sys_*`) now works on macOS/iOS via llvm-objcopy, not only on ELF. Fork `main` = 0.5.6 +
# one commit (23 §9). Build needs `llvm-nm`/`llvm-objcopy` (brew llvm) on macOS.
btls-sys = { git = "https://github.com/skymoore/btls", branch = "main" }
# pbjson-types (under a2a-pb, the A2A SDK's ProtoJSON layer): `Timestamp` serializes with
# `to_rfc3339()`, which emits `+00:00`; the protobuf JSON mapping requires Z-normalized output
# with 0/3/6/9 fractional digits and the official a2a-tck checks for it (DM-SERIAL003).
# `vendor/pbjson-types` = crates.io 0.9.0 (influxdata/pbjson 48ee598) + that one-line
# serializer change in `src/timestamp.rs` (50 §3.4). Drop when a pbjson-types release
# Z-normalizes and a2a-pb picks it up.
pbjson-types = { path = "vendor/pbjson-types" }
# a2a-client-lf (the A2A SDK client): its shared SSE parser appended every body chunk to an
# unbounded reassembly buffer before looking for an event terminator, so a peer that never
# sends the blank line (or sends one huge frame) could grow memory without limit ahead of
# theuth's post-decode caps (50 §8). `vendor/a2a-client` = crates.io 0.2.5 (a2aproject/a2a-rs
# 365d056) + `MAX_SSE_EVENT_BYTES` (64 KiB) enforced in `parse_sse_bytes` before the
# append; an oversized event yields one `A2AError` and ends the stream (50 §3.4). Drop when
# an a2a-client-lf release bounds the frame.
a2a-client-lf = { path = "vendor/a2a-client" }

# yaml-language-server: $schema=../../sdk/manifest.schema.json
# Hosted theuth nodes (design doc 224): a remote engine on DigitalOcean, Fly.io or Kubernetes that
# joins this mesh with a one-time ticket and keeps its state on a volume.
#
# Credentials: by default the plugin reads the provider CLIs' own files (doctl, fly, kubeconfig,
# ~/.aws). To use the theuth vault instead, store the token and add the line below to `env:`
# (widening: the install card asks again, and a missing secret stops the plugin):
#   t --secret-set digitalocean.token      →  DIGITALOCEAN_TOKEN: "{{secret:digitalocean.token}}"
#   t --secret-set fly.token               →  FLY_API_TOKEN: "{{secret:fly.token}}"
name: cloud-nodes
version: 0.1.0
description: Hosted theuth nodes on DigitalOcean, Fly.io or Kubernetes, joined to this mesh.
protocol: 1
run: [python3, main.py]
watch: [main.py, cloud_nodes.py, theuth_plugin.py]
tools:
  - name: providers
    description: >-
      Which cloud providers have credentials here (DigitalOcean, Fly.io, Kubernetes contexts, AWS
      profiles) and where they come from. Never returns a credential.
    input_schema: {type: object, properties: {}}
    annotations: {readOnlyHint: true}
  - name: create
    description: >-
      Create a hosted theuth node: a volume plus an instance running the theuth engine container,
      which joins this mesh with a one-time pairing ticket and restarts always. dry_run (default
      true) returns the plan and the estimated monthly cost without creating anything; billing
      starts only with dry_run false. Kubernetes runs `t mesh add --k8s`; AWS is a dry run only.
    input_schema:
      type: object
      required: [provider, name]
      properties:
        provider: {type: string, enum: [digitalocean, fly, kubernetes, aws]}
        name: {type: string, description: "Node name: 1-40 of [a-z0-9-]; also its mesh name."}
        region: {type: string, description: "lon1 (DigitalOcean), lhr (Fly), eu-west-2 (AWS) by default."}
        size: {type: string, description: "s-1vcpu-1gb (DigitalOcean), shared-cpu-1x (Fly), micro_3_0 (AWS) by default."}
        volume_gb: {type: integer, minimum: 1, default: 10}
        image: {type: string, description: "Engine image; default ghcr.io/basedatum/theuth/engine:latest. DigitalOcean also takes `build` (build deploy/computer on the Droplet)."}
        ssh_cidr: {type: string, description: "DigitalOcean: allow tcp/22 from this CIDR only (default: no inbound at all)."}
        ssh_key: {type: string, description: "DigitalOcean SSH key id or fingerprint."}
        context: {type: string, description: "Kubernetes: kubeconfig context."}
        namespace: {type: string, description: "Kubernetes: namespace."}
        storage_class: {type: string, description: "Kubernetes: StorageClass (default: the cluster's)."}
        deny_cluster_network: {type: boolean, description: "Kubernetes: NetworkPolicy denying the cluster's pod/service CIDRs."}
        dry_run: {type: boolean, default: true}
    annotations: {destructiveHint: true}
  - name: status
    description: A node's instance, volume and firewall (or Kubernetes objects), and whether it is a peer of this mesh.
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string}
        provider: {type: string, enum: [digitalocean, fly, kubernetes], default: digitalocean}
        context: {type: string}
        namespace: {type: string}
    annotations: {readOnlyHint: true}
  - name: list
    description: Every node this plugin made on every configured provider (tagged theuth-managed), including kept volumes.
    input_schema: {type: object, properties: {}}
    annotations: {readOnlyHint: true}
  - name: destroy
    description: >-
      Delete a node's instance and firewall; its volume too unless keep_volume (default true).
      Says whether it is still a mesh peer (`t mesh remove <id>`).
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string}
        provider: {type: string, enum: [digitalocean, fly, kubernetes], default: digitalocean}
        keep_volume: {type: boolean, default: true}
        context: {type: string}
        namespace: {type: string}
    annotations: {destructiveHint: true}

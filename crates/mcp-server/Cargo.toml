[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "theuth as an MCP server: rmcp streamable HTTP on loopback with a vault token, one catalogue shared with the `t mcp` stdio bridge, a JSONL audit (design doc 158 §12)"

[dependencies]
runtime = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
# 158 §12.2: `server` + `transport-streamable-http-server` come from the workspace line.
rmcp = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

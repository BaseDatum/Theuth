[package]
name = "aws-profiles"
version = "2.30.4"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "AWS profile names from the SDK's config/credentials files, never credentials (02 §2.2, 221 §6.1)"

# 221 B1: shared by `agent` (Bedrock) and `secrets-aws` (connections), so neither depends on the other.
[dependencies]
aws-config = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
aws-types = { workspace = true }
tokio = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs"]

[lints]
workspace = true

  <g fill="#3b6fd6">
    <rect x="60"  y="220" width="60" height="100"/>
    <rect x="160" y="160" width="60" height="160"/>
    <rect x="260" y="120" width="60" height="200"/>
    <rect x="360" y="180" width="60" height="140"/>

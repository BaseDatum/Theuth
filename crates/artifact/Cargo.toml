[package]
name = "artifact"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Files the agent makes for the user, shown in chat: `show` tool, content-addressed store, Typst PDF compile, SVG raster (design doc 35)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
agent = { workspace = true }
search = { workspace = true }
document = { workspace = true }
surface = { workspace = true }
platform = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
replica = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
futures = { workspace = true }
bytes = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
parking_lot = { workspace = true }
markdown = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }  # 199 P2: contact-file digests while streaming
hex = { workspace = true }
base64 = { workspace = true }
mime_guess = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
gray_matter = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
typst-as-lib = { workspace = true }
typst = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }
typst-render = { workspace = true }
resvg = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
figment = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "agent/ts", "search/ts", "surface/ts"]

[lints]
workspace = true

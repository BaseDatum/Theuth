[package]
name = "artifact"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Files the agent makes for the user, shown in chat: `show` tool, content-addressed store, Typst PDF compile, SVG raster (design doc 35)"

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }
agent = { workspace = true }
markdown = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
mime_guess = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
gray_matter = { workspace = true }
typst-as-lib = { workspace = true }
typst = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }
typst-render = { workspace = true }
resvg = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
figment = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "agent/ts"]

[lints]
workspace = true

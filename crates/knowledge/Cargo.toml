[package]
name = "knowledge"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Knowledge bundle: OKF files, FTS index, gix history, knowledge_* tools (design doc 10)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
okf = { workspace = true }
gix = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
replica = { workspace = true }
mesh = { workspace = true }  # 185 B6: `is_hub` in the sync manifest
platform = { workspace = true }
tools = { workspace = true }
document = { workspace = true }
search = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
sqlx = { workspace = true }
ts-rs = { workspace = true, optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
decision = { workspace = true }  # 212: peek_memory's local judge

[dev-dependencies]
figment = { workspace = true }
tempfile = "3"
parking_lot = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "search/ts", "document/ts"]

[lints]
workspace = true

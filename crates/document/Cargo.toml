[package]
name = "document"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Documents: the Yjs authority (yrs) behind every BlockNote editor, the store, the derived-markdown export/import loop and the headless helper client (design doc 59)"

[dependencies]
okf = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
platform = { workspace = true }
search = { workspace = true }
replica = { workspace = true }
surface = { workspace = true }
codeindex = { workspace = true }
mesh = { workspace = true }
secrets = { workspace = true }
web = { workspace = true }
voice = { workspace = true }
url = { workspace = true }
html-to-markdown-rs = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
futures = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
# 144 §7: the block index — `vec0` registered on the index pool's connections; the `EmbedActor` (`decision::embed`)
# supplies vectors and token counts.
sqlite-vec = { workspace = true }
libsqlite3-sys = { version = "0.36" }
decision = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
notify = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
yrs = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
parking_lot = { workspace = true }
tools = { workspace = true }
figment = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "search/ts", "codeindex/ts", "mesh/ts"]

[lints]
workspace = true

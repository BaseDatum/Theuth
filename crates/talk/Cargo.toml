[package]
name = "talk"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "A live, interruptible spoken conversation between the user and one session: the turn loop, barge-in and the heard-prefix ledger over voice's devices and models (design doc 76)"

[dependencies]
runtime = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }     # `RegisterPrompt` (76 §0.11)
agent = { workspace = true }     # `SendInput` / `Cancel{keep}` (76 §0.7; used by the actor, TALK-CORE)
voice = { workspace = true }     # `SpeechId`, `ModelState`, the `Dictation` lease (76 §4.1)
markdown = { workspace = true }  # `spoken` → sentences (76 §0.4; TALK-CORE)
pulldown-cmark = { workspace = true }  # is the open block prose? (76 §4.8; TALK-STREAM)
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }  # `ApprovalRequested.args` (145 §0.6)
schemars = { workspace = true }
base64 = { workspace = true }
strsim = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "voice/ts"]

[lints]
workspace = true

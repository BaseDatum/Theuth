[package]
name = "a2a"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A2A network boundary: official SDK client/server behind configured peers and exports (design doc 50 §6)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
agent = { workspace = true }
secrets = { workspace = true }
# 183 §14.4: contacts carry `tools::Risk` caps and `mesh::PeerPath`/`PairCeremony`.
tools = { workspace = true }
mesh = { workspace = true }
# 183 §7: the theuth/a2a/1 reach (iroh streams), the signed card (Ed25519 + JWS), the
# first-contact Attention items, the ceremony code and the LAN advert.
replica = { workspace = true }
roster = { workspace = true }
iroh = { workspace = true }
data-encoding = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
swarm-discovery = "0.6"
a2a-pb = "=0.3.2"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
bytes = { workspace = true }
platform = { workspace = true }
a2a-types = { workspace = true }
a2a-client = { workspace = true }
a2a-server = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
reqwest = { workspace = true }
url = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
zeroize = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }
agent = { workspace = true, features = ["test-support"] }

[features]
ts = ["dep:ts-rs", "runtime/ts", "agent/ts", "tools/ts", "mesh/ts"]

[lints]
workspace = true

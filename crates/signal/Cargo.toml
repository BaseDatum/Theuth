[package]
name = "signal"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Signal messenger frontend for the daemon (design doc 09)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
agent = { workspace = true }
chat-common = { workspace = true }
markdown = { workspace = true }
a2a = { workspace = true }
tools = { workspace = true }
double = { workspace = true }
artifact = { workspace = true }
secrets = { workspace = true }
surface = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
presage = { workspace = true }
presage-store-sqlite = { workspace = true }
link = { workspace = true }
voice = { workspace = true }
roster = { workspace = true }
tasks = { workspace = true }
mesh = { workspace = true }
# 210 §7.4 item 9: `/share` and the owner's live-share notices.
share = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde_yaml = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "agent/ts", "artifact/ts"]

[lints]
workspace = true

[package]
name = "tasks"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Task records: states, wakes, checkout, disposition, no-progress back-off; schedules that name an agent become tasks (design doc 67 §7)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
schedule = { workspace = true }
document = { workspace = true }
agent = { workspace = true }
mesh = { workspace = true }
replica = { workspace = true }
sessionsync = { workspace = true }  # 68 §4.4: the orphan sweep takes the lost engine's session
platform = { workspace = true }
chrono = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "schedule/ts", "document/ts", "agent/ts", "mesh/ts"]

[lints]
workspace = true

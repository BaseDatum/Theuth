[package]
name = "tasks"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Task records: states, wakes, checkout, disposition, no-progress back-off; schedules that name an agent become tasks (design doc 67 §7)"

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }
schedule = { workspace = true }
document = { workspace = true }
agent = { workspace = true }
mesh = { workspace = true }
replica = { workspace = true }
platform = { workspace = true }
chrono = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "schedule/ts", "document/ts", "agent/ts", "mesh/ts"]

[lints]
workspace = true

[package]
name = "browser"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Embedded obscura headless browser: per-session isolates, browser_* tools, render provider (23)"

[dependencies]
obscura-mcp = { workspace = true }
obscura-js = { workspace = true }
runtime = { workspace = true }
platform = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
decision = { workspace = true }
agent = { workspace = true }
parking_lot = { workspace = true }
web = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
iana-time-zone = { workspace = true }
unjar = { workspace = true }
webprofile = { workspace = true }
# 209 D8: the tile target's round trip (`WebViewCallRequested` / `answer_web_view_call`).
artifact = { workspace = true }
# 209 P5: `answer_element_form` / `element_forms_pending`, values held in `Zeroizing` strings,
# and the allowlist sanitiser of the card's snapshot (lol_html, BSD-3-Clause, already in the lock).
jsonrpsee = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
zeroize = { workspace = true }
lol_html = "2.9"
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

[dev-dependencies]
# tests/v8_isolates.rs: js-runtime and obscura isolates side by side in one process.
js-runtime = { workspace = true }
figment = { workspace = true }
tempfile = "3"
secrets = { workspace = true }
tracing-subscriber = { workspace = true }

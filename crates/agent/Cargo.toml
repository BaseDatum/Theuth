[package]
name = "agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Model loop (genai), session store (sqlite), skills, subagents"

[dependencies]
platform = { workspace = true }
knowledge = { workspace = true }
search = { workspace = true }
runtime = { workspace = true }
replica = { workspace = true }
models = { workspace = true }
tools = { workspace = true }
oauth = { workspace = true }
secrets = { workspace = true }
surface = { workspace = true }
cursor = { workspace = true }
acp = { workspace = true }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
genai = { workspace = true }
aws-config = { workspace = true }
parking_lot = { workspace = true }
sqlx = { workspace = true }
# 68 §3: the session extension on the store's write connection; the vendored
# build (workspace `[patch]`) compiles SQLITE_ENABLE_SESSION for every target.
libsqlite3-sys = { version = "0.36", features = ["session"] }
# 68 §2: `sessions.owner` is a mesh `EngineId`; only the id and the identity file loader are used.
mesh = { workspace = true }
nucleo = { workspace = true }
gray_matter = { workspace = true }
ts-rs = { workspace = true, optional = true }
serde_yaml = { workspace = true }
monty-pool = { workspace = true }
monty-types = { workspace = true }
monty-fs = { workspace = true }
regex = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
mime_guess = { workspace = true }
sha2 = { workspace = true }
# Design doc 50 §4: the SDK's core protocol types back durable A2A task
# records in `communication::network`; HTTP client/server stay in `crates/a2a`.
a2a-types = { workspace = true }
# 40 §4.3: the sensor bridge calls `http_request`'s tool struct directly (no
# registry, no approval); `url` parses the POST host rule.
web = { workspace = true }
url = { workspace = true }

[dev-dependencies]
figment = { workspace = true }
aws-types = { workspace = true }
wiremock = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "knowledge/ts", "secrets/ts", "search/ts"]

[lints]
workspace = true

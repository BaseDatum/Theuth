[package]
name = "sandbox"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Make an engine: bring `t` up on new compute (ssh host, docker container, sandbox VM) and join it to the mesh (design doc 67 §13, 64 §4, 79)"

[dependencies]
platform = { workspace = true }  # the product version (`platform::version`)
runtime = { workspace = true }
wire = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
secrets = { workspace = true }
mesh = { workspace = true }
tools = { workspace = true }
agent = { workspace = true }
update = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
russh = { workspace = true }
bollard = { workspace = true }
reqwest = { workspace = true }
minisign-verify = { workspace = true }
base64 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
microsandbox = { workspace = true }
rand = { workspace = true }
data-encoding = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
figment = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "mesh/ts"]
# `MockVmRuntime` for other crates' tests (79 §2.1).
mock = []

[lints]
workspace = true

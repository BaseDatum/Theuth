[package]
name = "link"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Relay uplink, Noise pairing and sessions, replicated paired-device registry (design docs 31, 69)"

[dependencies]
agent = { workspace = true }
document = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
platform = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
replica = { workspace = true }
secrets = { workspace = true }
mesh = { workspace = true }
sqlx = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
jsonrpsee = { workspace = true }
snow = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
qrcode = { workspace = true }
url = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

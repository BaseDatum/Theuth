[package]
name = "webprofile"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "One sealed, mesh-replicated browser profile shared by the web view tile and the agent's browser (design doc 209)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
replica = { workspace = true }
secrets = { workspace = true }
sqlx = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
jsonrpsee = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
psl = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
parking_lot = { workspace = true }
figment = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

[package]
name = "mesh"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Leaderless engine mesh: iroh endpoint, pairing, peer set, stability-elected hub lease, engine stats (design doc 67 §4)"

[dependencies]
rpc-core = { workspace = true }
jsonrpsee = { workspace = true }
replica = { workspace = true }
runtime = { workspace = true }
tools = { workspace = true }
platform = { workspace = true }
secrets = { workspace = true }
oauth = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
# 183 §14.3: `PairCeremony.id`.
uuid = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
# 183 §6.8: Nearby advertise + browse of `_theuth-mesh._udp` (already in the tree via the line above).
swarm-discovery = "0.6"
data-encoding = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# 183 R1: key material in frames zeroized on drop.
zeroize = { workspace = true, features = ["serde"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "replica/ts"]

[lints]
workspace = true

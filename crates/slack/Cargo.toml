[package]
name = "slack"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Slack frontend for the daemon over Socket Mode (design doc 21)"

[dependencies]
runtime = { workspace = true }
agent = { workspace = true }
tools = { workspace = true }
markdown = { workspace = true }
surface = { workspace = true }
slack-morphism = { workspace = true }
reqwest = { workspace = true }
# Both `ring` (reqwest) and `aws-lc-rs` (morphism's hyper-rustls) are linked; rustls
# panics unless one is installed as the process provider (21 §2.1). `Api::new` does it.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "agent/ts"]

[lints]
workspace = true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>We value your privacy</title>
  <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js" data-domain-script="0190-example"></script>
</head>
<body>
  <div id="onetrust-consent-sdk">
    <div class="onetrust-pc-dark-filter ot-fade-in"></div>
    <div id="onetrust-banner-sdk" class="otFlat bottom ot-wo-title" role="alertdialog" aria-describedby="onetrust-policy-text">
      <div id="onetrust-policy">
        <h2 id="onetrust-policy-title">We value your privacy</h2>
        <p id="onetrust-policy-text">We and our 143 partners store and/or access information on a device, such as cookies, and process personal data, such as unique identifiers and standard information sent by a device for personalised ads and content, ad and content measurement, and audience insights.</p>
      </div>
      <div id="onetrust-button-group-parent">
        <div id="onetrust-button-group">
          <button id="onetrust-reject-all-handler">Reject All</button>
          <button id="onetrust-accept-btn-handler">Accept All</button>
          <button id="onetrust-pc-btn-handler" class="cookie-setting-link">Manage Preferences</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

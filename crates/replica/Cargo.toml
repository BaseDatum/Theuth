[package]
name = "replica"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Small-record replication over the mesh: per-column LWW with a hybrid logical clock, change feed on connect and on commit (design doc 67 §5.1)"

[dependencies]
runtime = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
futures = { workspace = true }
parking_lot = { workspace = true }
notify = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# Spike only (`tests/spike_session_ext.rs`): the session extension on the vendored
# SQLCipher-on-BoringSSL build theuth links. `session` turns on `SQLITE_ENABLE_SESSION`
# and build-time bindgen in `vendor/libsqlite3-sys` for test builds; the runtime capture
# does not use it (see docs/design/67-replica-spike.md).
rusqlite = { version = "0.38", features = ["session", "bundled-sqlcipher"] }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

[package]
name = "rpc-core-macros"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Owner-trait RPC discovery descriptors"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"

[dev-dependencies]
rpc-core = { workspace = true }
jsonrpsee = { workspace = true, features = ["client-core"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

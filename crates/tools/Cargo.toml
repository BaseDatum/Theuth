[package]
name = "tools"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Tool registry, approval gate, builtin tools (shell, fs), MCP tool source"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
replica = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
zeroize = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
brush-core = { workspace = true }
brush-builtins = { workspace = true }
rmcp = { workspace = true, features = ["auth"] }
oauth = { workspace = true }
reqwest = { workspace = true }
platform = { workspace = true }
ts-rs = { workspace = true, optional = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
percent-encoding = { workspace = true }
notify = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
anydoc = { workspace = true }
regex = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
jsonschema = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
base64 = { workspace = true }
ec4rs = { workspace = true }  # 193 §3 .editorconfig

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }  # `O_NONBLOCK` open in `images.rs`

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

[dev-dependencies]
figment = { workspace = true }
tempfile = "3"
axum = { workspace = true }  # in-process MCP servers for the lifecycle tests (175)
sqlx = { workspace = true }  # 187: a replica row naming another writer, for the home derivation test
tracing-subscriber = { workspace = true }  # 187: count log lines per state change
tokio = { workspace = true, features = ["test-util"] }  # 187: backoff under a paused clock

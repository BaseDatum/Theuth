[package]
name = "tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tool registry, approval gate, builtin tools (shell, fs), MCP tool source"

[dependencies]
runtime = { workspace = true }
replica = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
brush-core = { workspace = true }
brush-builtins = { workspace = true }
rmcp = { workspace = true, features = ["auth"] }
oauth = { workspace = true }
reqwest = { workspace = true }
platform = { workspace = true }
ts-rs = { workspace = true, optional = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
notify = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
anydoc = { workspace = true }
regex = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
sha2 = { workspace = true }
jsonschema = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }  # `O_NONBLOCK` open in `images.rs`

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

[dev-dependencies]
figment = { workspace = true }

[package]
name = "double"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The owner's double: a local model of the owner's own decisions, with a per-class autonomy ladder (design doc 126)"

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }
replica = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
half = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true, optional = true }
# 126 W3 Tier B: the LoRA trainer over the frozen laya checkpoint (`decision::candle::lora`).
decision = { workspace = true }
candle-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serde_yaml = { workspace = true }
# The trainer tests need the differentiable encoder; dev-only, so `t` is built without it.
decision = { workspace = true, features = ["train"] }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts"]

[lints]
workspace = true

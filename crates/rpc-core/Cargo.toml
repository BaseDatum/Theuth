[package]
name = "rpc-core"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Plugin-free RPC state, identity and actor helpers"

[dependencies]
runtime = { workspace = true }
wire = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true, features = ["client-core"] }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
percent-encoding = "2"
rand = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true

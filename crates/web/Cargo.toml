[package]
name = "web"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Web search and fetch: search_web / read_url tools, SSRF-guarded fetcher, RRF aggregator, keyless engines, provider registry (design doc 16)"

[dependencies]
platform = { workspace = true }  # the product version (`platform::version`)
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
secrets = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
kameo = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
html-to-markdown-rs = { workspace = true }
html-escape = { workspace = true }  # `engines::decode_entities`
rand = { workspace = true }
flate2 = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# 199 D16: `fetch::download` hashes while it streams.
blake3 = "1.8.7"
# 122 revision 1: the stealth client (W5). Declared here so the dependency graph is fixed by the contract.
wreq = { workspace = true }
wreq-util = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
figment = { workspace = true }
image = { workspace = true }
tempfile = "3"
# Loopback HTTPS server for `fetch::download` tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

[features]
ts = ["dep:ts-rs", "runtime/ts"]

[lints]
workspace = true

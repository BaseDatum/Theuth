[package]
name = "share-edge"
version = "0.1.0"  # its own version and `share-edge-v*` tags, released apart from theuth (210 §8.4)
edition.workspace = true
publish.workspace = true
description = "theuth-share-edge: blind SNI edge for public web sharing, ACME and name registry (design doc 210)"

[lib]
name = "share_edge"
path = "src/lib.rs"

[[bin]]
name = "theuth-share-edge"
path = "src/main.rs"

# 210 §4.3: never `runtime`, `mesh`, `secrets`, `replica` or a plugin crate.
[dependencies]
share-proto = { workspace = true }
platform = { workspace = true }  # stop signal, owner-only key files
clap = { workspace = true }
tokio = { workspace = true, features = ["net"] }
iroh = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures = { workspace = true }
sqlx = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
humantime = { workspace = true }
dashmap = { workspace = true }
ppp = { workspace = true }
governor = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# SNI peek only (`server::Acceptor`); the edge never presents a certificate.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# 210 §6.1 (EDGE2): ACME, DNS records over zone-update's Porkbun client, job retries, CAA lookup.
instant-acme = { workspace = true }
zone-update = { workspace = true }
backon = "1"
x509-parser = { workspace = true }
time = "0.3"
uuid = { workspace = true }
hickory-resolver = "0.26"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
tempfile = "3"
rcgen = { workspace = true, features = ["x509-parser"] }

[lints]
workspace = true

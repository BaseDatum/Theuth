[package]
name = "rpc"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "JSON-RPC 2.0 over WebSocket: commands as methods, bus events as a subscription"

[dependencies]
platform = { workspace = true }  # the product version (`platform::version`)
runtime = { workspace = true }
rpc-core = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
jsonrpsee = { workspace = true, features = ["ws-client"] }
tower = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
figment = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true

[package]
name = "voice"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Read replies aloud: Pocket TTS in-process, Opus packets streamed to the frontend (design doc 43); voice notes in, MP3 clips out (design doc 45); the daemon's mic, speaker and echo-cancelled capture (design docs 54, 76)"

[dependencies]
runtime = { workspace = true }
wire = { workspace = true }
models = { workspace = true }  # `models::onnx::ort_lib`: the process-wide ONNX Runtime init (57 §6 step 1)
markdown = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
ptts = { workspace = true }
opus = { workspace = true }
xn = { workspace = true }
tools = { workspace = true }
parakeet-rs = { workspace = true }
ort = { workspace = true }
symphonia = { workspace = true }
rubato = { workspace = true }
mp3lame-encoder = { workspace = true }
parking_lot = { workspace = true }
flexaudio = { workspace = true }
cpal = { workspace = true }
wavekat-vad = { workspace = true }
ts-rs = { workspace = true, optional = true }
# 153 §5/§6: dictionary matcher and the history store.
sqlx = { workspace = true }
rphonetic = { workspace = true }
strsim = { workspace = true }
fst = { workspace = true, optional = true }
# 153 §5.2 (A2): the packaged dictionary — gz in the binary, sha256-checked against data/dictionary.json.
serde_json = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# 202: Parakeet TDT on MLX in-process; stubs itself off macOS aarch64. Behind `mlx` until it builds.
voice-mlx = { workspace = true, optional = true }
# 202 §4: the explicit MLX weights download.
reqwest = { workspace = true }

# 76 §0.5: Apple's VoiceProcessingIO mic unit (AEC + AGC + NS), moved here from the meeting crate.
# `metal`: Pocket TTS on the GPU (`DeviceKind::Auto` picks it; CPU if Metal fails to start) —
# first audio 6 ms against 26 ms on the CPU, at ~1 % of the CPU (M3 Max, 2026-11-17).
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { workspace = true }
ptts = { workspace = true, features = ["metal"] }

[features]
ts = ["dep:ts-rs", "runtime/ts"]
# 202: the in-process MLX engine. TODO(202): on by default for macOS aarch64 once crates/voice-mlx is green.
mlx = ["dep:voice-mlx"]

[lints]
workspace = true

[dev-dependencies]
figment = { workspace = true }
wiremock = { workspace = true }

[package]
name = "relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "theuth-relay: stateless encrypted-frame relay between harnesses and devices (design doc 31 §5)"

[[bin]]
name = "theuth-relay"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
platform = { workspace = true }  # SIGTERM / console-close stop signal
tokio-util = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
snow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# DigitalOcean OAuth code exchange for cloud nodes (src/oauth_do.rs, design doc 224).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Same as crates/slack: with both `ring` and `aws-lc-rs` in the workspace graph,
# `ServerConfig::builder()` panics unless a process provider is installed. `--tls` does it.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures = { workspace = true }

[[example]]
name = "relay_bench"
path = "examples/relay_bench.rs"

[lints]
workspace = true

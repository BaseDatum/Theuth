[package]
name = "desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tauri shell: macOS menubar app that launches the `theuth` sidecar on a pty, and the iOS link client; both host the RPC webview"

# 31 §8.3: the Tauri iOS bridge links the app as a static library, so the
# Builder lives in the lib and the desktop binary is a one-line shim.
[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "theuth-desktop"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-notification = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Desktop only: the local daemon launcher (pty) and the menubar integrations.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-positioner = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-dialog = { workspace = true }
portable-pty = { workspace = true }
anyhow = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
# 39 §3.3: background check + verify, install at quit; tokio for `sleep`, rand for the
# jitter, nix `access(2)` to skip a bundle we cannot rename without a password prompt.
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
nix = { workspace = true, features = ["fs"] }
# Speech model files from the release bucket at start (crates/desktop/src/models.rs).
reqwest = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

# Mobile only: QR scanning for `/link` and the universal-link handoff (31 §8.2).
# Direct versions: these have no other consumer, so they are not in the
# workspace dependency table.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-deep-link = "2"

# macOS only: the meetings island (53 decision 8, 03 §1) — `NSPanel` swizzle, notch geometry,
# screen-change notification. `objc2`/`block2` are the same line the iOS table pins.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { workspace = true }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

# iOS only: `UIApplication.beginBackgroundTask` so the relay socket outlives
# backgrounding for the grace period iOS grants (31 §8). Same objc2 line tauri uses.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication", "UIResponder", "block2"] }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true

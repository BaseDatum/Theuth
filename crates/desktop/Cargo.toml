[package]
name = "desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tauri shell: macOS menubar app that launches the `theuth` sidecar on a pty, and the iOS link client; both host the RPC webview"

# 31 §8.3: the Tauri iOS bridge links the app as a static library, so the
# Builder lives in the lib and the desktop binary is a one-line shim.
[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "theuth-desktop"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-notification = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 120 §4.2: the `theuth-page` token is 128 random bits per put, on both containers.
rand = { workspace = true }

# Desktop only: the local daemon launcher (pty) and the menubar integrations.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-dialog = { workspace = true }
portable-pty = { workspace = true }
anyhow = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
# 39 §3.3: background check + verify, install at quit; tokio for `sleep`, `rand` (above) for the
# jitter, `platform::files::writable` to skip a bundle we cannot rename without a password prompt.
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
platform = { workspace = true }
# Speech model files from the release bucket at start (crates/desktop/src/models.rs).
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# 130 D10 / 134 D10: `theuth://` on the desktop (registered on macOS and Windows, `lib.rs`); same crate the mobile table pins.
tauri-plugin-deep-link = "2"
# 205 §5 (`src/asset.rs`): Tauri's `asset` scheme handler, copied with a `web-*` check; same crates tauri uses.
http-range = "0.1"
percent-encoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

# Mobile only: QR scanning for `/link` and the universal-link handoff (31 §8.2); haptics for the
# voice-note gesture (89 VOICE-HOLD).
# Direct versions: these have no other consumer, so they are not in the
# workspace dependency table.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-haptics = "2"

# macOS only: the meetings island (53 decision 8, 03 §1) — `NSPanel` swizzle, notch geometry,
# screen-change notification. `objc2`/`block2` are the same line the iOS table pins.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { workspace = true }
objc2 = "0.6"
block2 = "0.6"
# 130 D10 (`companion/macos.rs`): `NSWorkspace` launch and `NSRunningApplication` queries on top of the
# workspace feature set; `libc` for `kill(pid, 0)` in the quit handshake.
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication", "block2", "libc"] }
objc2-foundation = { workspace = true, features = ["NSURL", "NSError"] }
libc = { workspace = true }

# Windows only: the island's Win32 styles on the `HWND` `raw_window_handle` yields (58 §6.2). Same
# `windows-sys` line as `crates/platform`. 134 D10 (`companion/windows.rs`): `Win32_System_Threading` for
# the companion's alive mutex (`OpenMutexW`) and `TerminateProcess`; `tauri-plugin-single-instance` with
# the `deep-link` bridge because a `theuth://` link starts a second `theuth-desktop.exe` with the URL in argv.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# iOS only: `UIApplication.beginBackgroundTask` so the relay socket outlives
# backgrounding for the grace period iOS grants (31 §8), and the scene-configuration /
# windowing-control-style surface `ios_windowing.rs` uses (111). Same objc2 line tauri uses.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { workspace = true }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIScreen", "UITraitCollection", "UIInterface", "UIScene", "UISceneConfiguration", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UISceneWindowingControlStyle", "block2"] }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No scale lock: pinch/user zoom to 200% is an accessibility requirement. Safe-area insets and keyboard-resizes-content stay. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme.js"></script>
    <!-- Pre-paint page colour (DARK-FLASH). External on purpose: an inline <style> here gets a Tauri nonce in
         `style-src`, which voids `'unsafe-inline'` and blocks every runtime-injected stylesheet (xterm's colours). -->
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

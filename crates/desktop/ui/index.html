<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No scale lock: pinch/user zoom to 200% is an accessibility requirement. Safe-area insets and keyboard-resizes-content stay. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme.js"></script>
    <!-- `--bg-page` (src/styles.css) on <html> before the stylesheet arrives, keyed on the class theme.js just set,
         so no frame paints the webview's default white. `:where` keeps the island's `html[data-island]` rule winning. -->
    <style>
      html { background: #e8dcc8 }
      html:where(.dark) { background: #12100e }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Encrypted versioned secrets vault, placeholder expansion, secret_* tools (37)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
platform = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
replica = { workspace = true }
sqlx = { workspace = true }
oauth = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }
chacha20poly1305 = { workspace = true }
keyring = { workspace = true }
aho-corasick = { workspace = true }
# 183 §6.9: the W-29 key id, and `WireKey.key` in base32 as `PairHello.vault_key`.
sha2 = { workspace = true }
data-encoding = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Windows only: the Credential Manager directly with `CRED_PERSIST_LOCAL_MACHINE` (key.rs `cred`);
# same `windows-sys` line as `crates/platform`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
figment = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts"]

[lints]
workspace = true

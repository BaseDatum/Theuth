[package]
name = "schedule"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Prompt files that fire on a clock: schedules/ directory, croner tick, one session per schedule, reply delivery (design doc 34)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
replica = { workspace = true }
mesh = { workspace = true }
platform = { workspace = true }
tools = { workspace = true }
agent = { workspace = true }
genai = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
croner = { workspace = true }
humantime = { workspace = true }
gray_matter = { workspace = true }
notify = { workspace = true }
sqlx = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }
agent = { workspace = true, features = ["test-support"] }  # 194: a live model-less engine for the run's effort

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "agent/ts"]

[lints]
workspace = true

[package]
name = "roster"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Agents as files: agents/ directory, desks and episodes, journal, budgets, proposals; delivers wakes to desks (design doc 67 §6)"

[dependencies]
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
artifact = { workspace = true }  # the attention inbox records `ArtifactShown` (104 A1)
tasks = { workspace = true }
agent = { workspace = true }
knowledge = { workspace = true }
document = { workspace = true }
mesh = { workspace = true }
sandbox = { workspace = true }  # the agent pin asks EnsureVm (79 §4.9)
replica = { workspace = true }
secrets = { workspace = true }
platform = { workspace = true }
chrono = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
figment = { workspace = true }
agent = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "tasks/ts", "agent/ts", "knowledge/ts"]

[lints]
workspace = true

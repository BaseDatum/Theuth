[package]
name = "surface"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "json-render fences (design doc 30): parse, repair, validate; one catalog for prompt, TUI and desktop"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonrepair-rs = { workspace = true }
tracing = { workspace = true }
markdown = { workspace = true }
unicode-width = { workspace = true }
platform = { workspace = true }
regex = { workspace = true }
strsim = { workspace = true }
# Mermaid → terminal text; bake-off winner (fixtures/mermaid/BAKEOFF.md).
merman = { version = "0.7", features = ["ascii"] }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[lints]
workspace = true

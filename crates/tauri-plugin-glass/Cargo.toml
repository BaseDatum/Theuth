[package]
name = "tauri-plugin-glass"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Design 198: native iOS 26 Liquid Glass chrome (top bar, scroll-to-bottom) floated over the chat webview"
# tauri-plugin's build script requires the `links` key (it carries the permission files to the app's ACL).
links = "tauri-plugin-glass"

[dependencies]
tauri = { workspace = true }

[build-dependencies]
# Direct version: the one first-party plugin, no other consumer of the build half.
tauri-plugin = { version = "2", features = ["build"] }

[lints]
workspace = true

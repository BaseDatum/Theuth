[package]
name = "meeting"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Meeting recorder: the meeting app's audio and the microphone as live Opus tracks, a manifest and index, the meeting's own session (design doc 53)"

[dependencies]
runtime = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
jsonrpsee = { workspace = true }
wire = { workspace = true }
agent = { workspace = true }
tools = { workspace = true }
document = { workspace = true }  # one note per meeting; the summary turn edits it (59 §7.4)
decision = { workspace = true }  # the oracle pre-filter on transcript batches (57 §3)
voice = { workspace = true }
talk = { workspace = true }  # 158 §4.6: `TalkEvent` — a live talk quiets the detector
models = { workspace = true }  # `models::onnx::ort_lib` before the diarisation sessions (57 §6 step 1)
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
rtrb = { workspace = true }
opus = { workspace = true }
rubato = { workspace = true }
ogg = { workspace = true }
flexaudio = { workspace = true }
libc = { workspace = true }
knf-rs = { workspace = true }
realfft = { workspace = true }
ort = { workspace = true }
hound = { workspace = true }
base64 = { workspace = true }
ts-rs = { workspace = true, optional = true }
search = { workspace = true }
# 158 §7 (W2): calendar. calcard = Stalwart's iCalendar parser + RRULE/RDATE/EXDATE expansion,
# RECURRENCE-ID overrides, VTIMEZONE/Windows zone names (default features drop the JMAP half).
calcard = { version = "0.3", default-features = false }
reqwest = { workspace = true }  # ICS subscription GET (conditional)
secrets = { workspace = true }  # the subscription URL is a vault row `calendar.ics.<id>`
url = { workspace = true }  # join-link host, Google redirect unwrapping
# 158 §10–§11 (W4): templates as markdown + YAML front matter, cue regexes, shipped-body hashes.
gray_matter = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-av-foundation = { workspace = true }

# 58 §6.1: the process pickers flexaudio does not provide. `windows` pinned to what
# flexaudio-os-windows uses (one copy in the graph); `pipewire` is its Linux backend's crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.54.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }  # examples/capture_probe: flexaudio's warnings on stderr
figment = { workspace = true }
parking_lot = { workspace = true }
agent = { workspace = true, features = ["test-support"] }  # 194 R1: a live model-less engine for the meeting session's effort

[features]
ts = ["dep:ts-rs", "runtime/ts", "agent/ts", "tools/ts", "voice/ts", "decision/ts", "document/ts", "search/ts"]

[lints]
workspace = true

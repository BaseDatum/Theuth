[package]
name = "computer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Screenshot and pointer/keyboard tools over the user's desktop (design doc 27)"

[dependencies]
runtime = { workspace = true }
platform = { workspace = true }
tools = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
xcap = { workspace = true }
enigo = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { workspace = true }
# 121: ScreenCaptureKit screenshots, the default macOS capture path (`screen.rs`).
screencapturekit = { workspace = true }
# 96: accessibility reader (`ax.rs`).
objc2-application-services = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["CFURL", "CFNumber", "CFArray"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { workspace = true }

# 149 WE1: UI Automation reader (`ax.rs`, `windows_uia`). 0.62 is the `windows` the graph already
# carries through xcap 0.9.8 (no workspace entry exists; `meeting` pins =0.54.0 for flexaudio),
# so this adds a dependency edge, not a crate version. `Win32_System_Ole` + `Win32_System_Com`
# gate the `VARIANT` struct; `Win32_UI_WindowsAndMessaging` is the foreground window and
# `GetWindowTextW` fallback; `Win32_System_Threading` is `QueryFullProcessImageNameW`.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
figment = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts"]

[lints]
workspace = true
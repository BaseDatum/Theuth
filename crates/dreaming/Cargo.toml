[package]
name = "dreaming"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Dreaming: the nightly own-context routine that tidies knowledge, mines cases and tunes skills behind a gate (design doc 136)"

[dependencies]
runtime = { workspace = true }
wire = { workspace = true }
rpc-core = { workspace = true }
jsonrpsee = { workspace = true }
decision = { workspace = true }
double = { workspace = true }
replica = { workspace = true }
tools = { workspace = true }
knowledge = { workspace = true }  # 136 §2.1 commands (Stats, Merge, …) and types
agent = { workspace = true }  # 136 §2.2 `LedgerSince`, `SetBudget`, `AgentEvent`, the durable store handle
schedule = { workspace = true }  # 136 §2.3 `FireWith` for `run_now`
document = { workspace = true }  # 136 §2.4 the `Dreaming` journal document (W3)
mesh = { workspace = true }  # the engine id written into signals.json (`home_engine`)
roster = { workspace = true }  # `desks_doing` from `ListAgents` (no desk bus event exists)
genai = { workspace = true }  # `ChatRole::Assistant` on the agent store's rows (rewind snapshot)
kameo = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }  # 136 §2.7 `dreaming.set_settings` persists the section (W3)
schemars = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }  # the token patterns of `scrub`
sha2 = { workspace = true }  # the train/val split hash (136 §6)
evalcore = { workspace = true }  # 159 §13.1 the shared eval core: split, judge prompt, margin + paired gate, run_case (W2)
uuid = { workspace = true }  # time-ordered ids (no ulid crate in the workspace)
sqlx = { workspace = true }  # read-only `dry_run` over knowledge.sqlite / sessions.sqlite
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
figment = { workspace = true }

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "knowledge/ts", "agent/ts", "schedule/ts"]

[lints]
workspace = true

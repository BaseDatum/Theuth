[package]
name = "app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Interactive OpenUI apps: the `app` publishing tool, the headless parser helper, and the app actor that runs one-press tool calls (design doc 46)"

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }
artifact = { workspace = true }
link = { workspace = true }
agent = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
ts-rs = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
figment = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "artifact/ts", "agent/ts"]

[lints]
workspace = true

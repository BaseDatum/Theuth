[package]
name = "app"
version = "2.22.2"  # frozen: only the binaries carry the product version (platform::version)
edition.workspace = true
publish.workspace = true
description = "Interactive OpenUI apps: the `app` publishing tool, the in-process headless validator (js-runtime), and the app actor that runs one-press tool calls (design doc 46)"

[dependencies]
jsonrpsee = { workspace = true }
runtime = { workspace = true }
wire = { workspace = true }
tools = { workspace = true }
js-runtime = { workspace = true }  # the OpenUI check/merge validator and mermaid check in-process (js-runtime-unified-as-built.md)
artifact = { workspace = true }
rpc-core = { workspace = true }
rpc-core-macros = { workspace = true }
agent = { workspace = true }
roster = { workspace = true }
schedule = { workspace = true }
autoresearch = { workspace = true }  # 140 §4.1 the study draft card (`study_draft.rs`): the spec, its validation, the drafts dir
kameo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
ts-rs = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
figment = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"

[features]
ts = ["dep:ts-rs", "runtime/ts", "tools/ts", "artifact/ts", "agent/ts", "schedule/ts", "autoresearch/ts"]

[lints]
workspace = true

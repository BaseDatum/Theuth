[package]
name = "decision"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Local typed-probability oracle (laya in candle) with a selective gate in front of the reasoning model (design doc 57)"

[features]
# NVIDIA (58): off by default, forwarded for the Linux/Windows build.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# TypeScript bindings for the desktop (`Mode`, `ModeInfo`, `FamilyStats`).
ts = ["dep:ts-rs", "runtime/ts"]
# GLINER-3 spike only: the GLiNER2.5-Decide ONNX export through ONNX Runtime (`gliner::onnx`) as a
# bench/parity control for the candle port. Off by default so `decision` ships ORT-free.
gliner-onnx = ["dep:ort"]
# 126 W0/W3: differentiable encoder (`rope_slow`, primitive softmax / layer-norm) so `backward()`
# reaches a LoRA adapter (`candle::lora`). Off by default; the shipped forward is unchanged. A
# trainer binary (`t double train-b`, the `lora_step` example) needs it — `lora::TRAIN_BUILD`.
train = []

[dependencies]
jsonrpsee = { workspace = true }
rpc-core = { workspace = true }
runtime = { workspace = true }
platform = { workspace = true }  # `sha256::cached`: the `<weights>.sha256` sidecar shared with the desktop downloader
tools = { workspace = true }
models = { workspace = true }  # `models::accelerator`: the `models.accelerator` knob `Device::Auto` follows (58 step 12)
kameo = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }  # the session slot: locked only inside `spawn_blocking`
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
libc = { workspace = true }  # `process_memory`: proc_pid_rusage on macOS
regex = { workspace = true }  # gliner: the word splitter the Python processor uses
ts-rs = { workspace = true, optional = true }
# laya's fast BPE `tokenizer.json`; the same build parakeet-rs pulls (57 §1).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# The engine (57 §12.8): laya-rs 0.1.0's model code vendored under `src/candle/`, candle 0.11 is its pin.
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }  # `models::debertav2`: GLiNER2.5-Decide's encoder
ort = { workspace = true, optional = true }  # `gliner-onnx` spike only

# On a Mac: Metal for the GPU path and Accelerate for the CPU fallback; the Linux/Windows build is
# plain CPU unless `cuda` is on.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal", "accelerate"] }
candle-nn = { workspace = true, features = ["metal", "accelerate"] }
candle-transformers = { workspace = true, features = ["metal", "accelerate"] }

[[example]]
name = "lora_step"
required-features = ["train"]

[dev-dependencies]
tempfile = "3"
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true }  # tests/model.rs: show the engine's info lines under --nocapture

[lints]
workspace = true

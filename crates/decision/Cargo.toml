[package]
name = "decision"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Local typed-probability oracle (laya via ONNX Runtime or candle) with a selective gate in front of the reasoning model (design doc 57)"

[features]
# Third backend (57 §12.8): laya-rs's `DecisionModel` on candle, Metal on macOS.
candle = ["dep:laya-rs", "dep:candle-core", "dep:candle-nn"]
# Apple Accelerate BLAS for the candle CPU path (bench data point).
accelerate = ["candle", "laya-rs/accelerate"]

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }
models = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }  # the session slot: locked only inside `spawn_blocking`
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
humantime = { workspace = true }
ort = { workspace = true }
half = { workspace = true }
# laya's fast BPE `tokenizer.json`; the same build parakeet-rs pulls (57 §1).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
laya-rs = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }

# Metal kernels wherever `candle` is on and the target is a Mac; the Linux/Windows build of the
# same feature is CPU (CUDA is 58's).
[target.'cfg(target_os = "macos")'.dependencies]
laya-rs = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = { workspace = true }
libc = { workspace = true }  # bench: ru_maxrss
tracing-subscriber = { workspace = true }  # tests/model.rs: show the engine's info lines under --nocapture

[lints]
workspace = true

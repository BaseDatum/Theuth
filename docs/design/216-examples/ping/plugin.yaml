# docs/design/216-examples/ping/plugin.yaml — design 216 §13.2
name: ping
version: 0.1.0
description: Pings a host every 10 seconds; a status dot and the round trip in its tooltip.
protocol: 1
run: [bash, run.sh]
env:
  PING_HOST: "1.1.1.1"
placements:
  - id: ping
    kind: status
    icon: activity
    label: Ping
    status: true
    scope: global
capabilities: []

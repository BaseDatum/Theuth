# cargo-deny (`cargo deny check licenses`). 221 §13 B2: the licence allow-list, with the GPL-3.0
# option of `bitwarden/sdk-internal` (`GPL-3.0-only OR LicenseRef-Bitwarden-SDK`, D3) allowed only
# for the `bitwarden-*` crates. B10 widens this to every GPL-3.0-compatible licence once theuth's
# own crates carry `GPL-3.0-or-later` (D26).

[licenses]
# Permissive licences, all GPL-3.0-compatible.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# theuth's own crates are `publish = false` and carry no `license` field until B10.
[licenses.private]
ignore = true

# D3: the SDK taken under its GPL-3.0 option. Scoped by crate name, never a global allow, so a
# crate under the Bitwarden SDK licence alone still fails. Names from the `sdk@2b06afa` graph.
[[licenses.exceptions]]
name = "bitwarden-api-api"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
name = "bitwarden-api-base"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
name = "bitwarden-api-identity"

# cargo-deny (`cargo deny check licenses`), 221 D22/D26/B10. theuth is GPL-3.0-or-later and the
# release binaries are GPL-3.0 works, so any GPL-3.0-compatible licence is allowed. Anything else
# fails, including a crate under the Bitwarden SDK licence alone: `bitwarden/sdk-internal` is
# `GPL-3.0-only OR LicenseRef-Bitwarden-SDK`, which passes through its GPL-3.0-only side (D3);
# `LicenseRef-Bitwarden-SDK` itself is never allowed.

[licenses]
allow = [
    # Copyleft, GPL-3.0-compatible.
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MPL-2.0",
    # Permissive.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "WTFPL",
    "BlueOak-1.0.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

# Deprecated SPDX ids that cargo-deny cannot match against the allow list, read as their
# current equivalents (SPDX: the bare form means `-only`).
[[licenses.clarify]]
crate = "firecrawl-native"
expression = "AGPL-3.0-only"
license-files = []
[[licenses.clarify]]
crate = "mp3lame-encoder"
expression = "LGPL-3.0-only"
license-files = []
[[licenses.clarify]]
crate = "mp3lame-sys"
expression = "LGPL-3.0-only"
license-files = []

# theuth's own crates: `license.workspace = true` (GPL-3.0-or-later); checked like any other.
[licenses.private]
ignore = false

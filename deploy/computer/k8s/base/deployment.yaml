# One engine: a single replica, Recreate (two pods must never share one /data), restartPolicy
# Always (an applied update exits 75 and comes back on the new /data/bin/t). No Service: the engine
# only dials out (mesh relay, model APIs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: theuth-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: theuth-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: theuth-engine
    spec:
      serviceAccountName: engine
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: ghcr.io/basedatum/theuth/engine:latest
          env:
            - name: THEUTH_PAIR_TICKET_FILE
              value: /run/theuth/pair/ticket
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            - name: pair
              mountPath: /run/theuth/pair
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
        # The one-time pairing ticket; optional, because `t mesh add --k8s` deletes it once the
        # engine joined and later restarts must not wait for it.
        - name: pair
          secret:
            secretName: pair
            optional: true
            defaultMode: 0440

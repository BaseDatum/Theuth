# `--deny-cluster-network` (design doc 224 §7.3): no ingress; egress to DNS and the internet, not to
# the cluster's pod/service CIDRs or the cloud metadata address. The overlay replaces `except` with
# the CIDRs it detected (`kubectl get nodes`, `kubectl get servicecidrs`) or was given.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy.yaml

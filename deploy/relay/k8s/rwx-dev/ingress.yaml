apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wth
  annotations:
    haproxy.org/server-crt: wth-rwx-dev-cert-tls
    haproxy.org/request-set-header: |
      X-Forwarded-Proto https
    # Long-lived WSS (/h/<id>). timeout-tunnel governs the upgraded connection.
    haproxy.org/timeout-server: 3600s
    haproxy.org/timeout-tunnel: "3600s"
    # Co-locate uplink + device sockets for one harness (31 §5.5).
    haproxy.org/load-balance: "uri"
    haproxy.org/hash-type: consistent
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - relay.wth.rwx.dev
        - wth.rwx.dev
      secretName: wth-rwx-dev-cert-tls
  rules:
    - host: relay.wth.rwx.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wth-relay
                port:
                  number: 8787
    - host: wth.rwx.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wth-relay
                port:
                  number: 8787

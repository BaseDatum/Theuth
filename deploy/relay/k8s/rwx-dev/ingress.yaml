apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: theuth
  annotations:
    haproxy.org/server-crt: theuth-io-cert-tls
    haproxy.org/request-set-header: |
      X-Forwarded-Proto https
    # Long-lived WSS (/h/<id>). timeout-tunnel governs the upgraded connection.
    haproxy.org/timeout-server: 3600s
    haproxy.org/timeout-tunnel: "3600s"
    # Co-locate uplink + device sockets for one harness (31 §5.5).
    haproxy.org/load-balance: "uri"
    haproxy.org/hash-type: consistent
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - theuth.io
        - relay.theuth.io
        - app.theuth.io
      secretName: theuth-io-cert-tls
  rules:
    - host: relay.theuth.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: theuth-relay
                port:
                  number: 8787
    - host: app.theuth.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: theuth-relay
                port:
                  number: 8787
    - host: theuth.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: theuth-relay
                port:
                  number: 8788

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: theuth

resources:
  - ../base
  - ingress.yaml
  - secret.yaml

images:
  - name: ghcr.io/skymoore/theuth/relay
    newTag: 9ecb23c

patches:
  - target:
      kind: Deployment
      name: theuth-relay
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: theuth

resources:
  - ../base
  - ingress.yaml
  - ingress-iroh.yaml
# The Secret `theuth-relay` (key cookie-secret) is created out of band and never committed:
#   kubectl -n theuth create secret generic theuth-relay --from-literal=cookie-secret="$(openssl rand -hex 32)"
# Rotating it drops every existing __Host-link cookie; browsers re-fetch on the next page load.

images:
  - name: ghcr.io/skymoore/theuth/relay
    newName: ghcr.io/basedatum/theuth/relay
    newTag: e35c6cc9e
patches:
  - target:
      kind: Deployment
      name: iroh-relay
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
  - target:
      kind: Deployment
      name: theuth-relay
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret

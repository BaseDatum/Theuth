# iroh-relay for the engine mesh (design doc 67 §4.2), beside theuth-relay.
# One replica: engines pick a home relay and peers find them through it, so
# the relay keeps per-connection state and does not scale out behind one name.
# TLS is terminated in the pod (the QUIC probe needs the same certificate), so
# the ingress passes TCP 443 through by SNI and a LoadBalancer carries 7842/udp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay
  labels:
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/component: mesh-relay
    app.kubernetes.io/part-of: theuth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iroh-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/component: mesh-relay
        app.kubernetes.io/part-of: theuth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iroh-relay
          image: ghcr.io/skymoore/theuth/iroh-relay:latest
          imagePullPolicy: Always
          args: ["--config-path", "/etc/iroh-relay.toml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 7842
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: certs
          secret:
            # The *.theuth.io certificate the ingress serves for theuth-relay,
            # extended with the iroh.relay.theuth.io SAN (overlay ingress.yaml).
            secretName: theuth-io-cert-tls
      terminationGracePeriodSeconds: 20

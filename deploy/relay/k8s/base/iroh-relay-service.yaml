apiVersion: v1
kind: Service
metadata:
  name: iroh-relay
  labels:
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/part-of: theuth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iroh-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: metrics
      port: 9090
      targetPort: metrics

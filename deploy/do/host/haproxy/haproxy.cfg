# SNI router for the theuth host (deploy/do/host/compose.yaml). TCP mode only: TLS is terminated by Caddy
# (theuth.io names), by iroh-relay itself, or never (the share edge splices visitor TLS to the engine).
# Backends are the static compose IPs; Caddy and the edge trust PROXY v2 from 172.30.0.10 (this container) only.
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s

frontend https_in
    bind :8443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content reject if !{ req.ssl_hello_type 1 }
    use_backend iroh_relay if { req.ssl_sni -i iroh.relay.theuth.io }
    use_backend caddy_https if { req.ssl_sni -i theuth.io www.theuth.io relay.theuth.io app.theuth.io }
    # *.tun.zip at any depth (<n>.tun.zip, <label>.<n>.tun.zip, edge/iroh/relay.tun.zip) as in the cluster.
    use_backend share_edge if { req.ssl_sni -m end -i .tun.zip }
    # Anything else (no SNI, other names) is closed. (A `tcp-request content reject` here would run BEFORE the
    # use_backend rules and drop everything.)
    default_backend reject

frontend http_in
    bind :8080
    default_backend caddy_http

backend caddy_https
    server caddy 172.30.0.11:8443 send-proxy-v2

backend caddy_http
    server caddy 172.30.0.11:8080 send-proxy-v2

backend iroh_relay
    server iroh-relay 172.30.0.13:8443

backend share_edge
    server share-edge 172.30.0.14:8443 send-proxy-v2

backend reject
    tcp-request content reject

# theuth-share-edge on the rwx-dev cluster: P0 smoke (admission closed, Let's Encrypt staging).
#   kubectl kustomize deploy/share-edge/k8s/rwx-dev        # render
#   kubectl apply -k deploy/share-edge/k8s/rwx-dev         # owner only
# The Secret `theuth-share-edge` (key dns.json) is created out of band and never committed.
# Public 443: HAProxy (haproxy-controller) passes TLS through by SNI to Service theuth-share-edge:8443. The Ingresses
# doing it are created and deleted by the edge itself (image built with `--features k8s`, templates under `k8s:` in
# configmap.yaml, RBAC in rbac.yaml), not committed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: theuth

resources:
  - ../base
  - rbac.yaml
  # - service-iroh-udp.yaml   # UDP 7850 NodePort; owner router decision pending (see the file)

images:
  - name: ghcr.io/skymoore/theuth/share-edge
    newTag: share-edge-6f6c70bd2

patches:
  - path: configmap.yaml
  - target:
      kind: Deployment
      name: theuth-share-edge
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: amd64
      # In-cluster API credentials for the Ingress templates (rbac.yaml); the base turns the token off.
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: theuth-share-edge
      # Admin socket off the NFS data volume (configmap.yaml admin.socket).
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: run
          emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: run
          mountPath: /run/theuth-share-edge
  # No LoadBalancer controller here (iroh-relay-quic sits <pending>): ClusterIP, HAProxy passes 443 through to 8443.
  - target:
      kind: Service
      name: theuth-share-edge
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/externalTrafficPolicy
      - op: replace
        path: /spec/ports
        value:
          - {name: tls, port: 8443, targetPort: tls, protocol: TCP}
  # The cluster has no default StorageClass; nfs-csi is the only one. SQLite on NFS: see docs/design/210-as-built-DEPLOY1.md.
  - target:
      kind: PersistentVolumeClaim
      name: theuth-share-edge-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-csi

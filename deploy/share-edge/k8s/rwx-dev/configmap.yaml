# Production config since 2026-11-23: admission open, Let's Encrypt PRODUCTION, require_caa: true against the
# CAA records now live at Porkbun for the production account (§8.2; the edge refuses to start without them).
# The terms/abuse pages are still example.com placeholders (TBD, §9.5). Replaces the base's config.yaml whole.
apiVersion: v1
kind: ConfigMap
metadata:
  name: theuth-share-edge
data:
  config.yaml: |
    domain: tun.zip
    data_dir: /var/lib/theuth-share-edge
    listen: "[::]:8443"
    # The Ingresses below send PROXY v2 (haproxy.org/send-proxy-protocol); HAProxy pods connect from the pod network
    # (kubeadm podSubnet 10.244.0.0/16; the controller DaemonSet is not hostNetwork). Not narrower: HAProxy pod IPs
    # come from that subnet with no fixed per-node range in this repo's config; networkpolicy.yaml limits who can
    # reach 8443 to the haproxy-controller namespace, which is what makes trusting the whole subnet safe.
    listen_proxy_protocol: {trusted: ["10.244.0.0/16"]}
    # public_addrs empty: no UDP path into the cluster yet (service-iroh-udp.yaml), clients reach the edge via the relay.
    iroh: {listen: "[::]:7850", relay: https://iroh.relay.theuth.io, public_addrs: []}
    # Socket on the emptyDir the overlay mounts, not on the NFS data volume.
    admin: {socket: /run/theuth-share-edge/admin.sock, http: "[::]:9090"}
    admission: open
    # Standby key is OFFLINE (§13): secret only in the owner's vault (tunzip.edge.standby.key.b64); the edge never
    # holds it. Rotation: theuth-share-edge retire --standby-key <file> --config <cfg>, edge stopped.
    standby_public: 8dc34c5495d079157b02ff81ddbd47de68b60ef9f579e86bb8d5fb46c670a075
    terms_url: https://example.com/share-terms     # still a placeholder; admission opened with it (§9.5 TBD)
    terms_rev: "2026-11-23"
    abuse_url: https://example.com/share-abuse     # TBD
    abuse_contact: abuse@example.com               # TBD
    # true since 2026-11-23: the production account's issue/issuewild CAA lines are live at Porkbun
    # (0 issue/issuewild "letsencrypt.org; accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/4035598822;
    # validationmethods=dns-01"). A staging account's URI would not match that accounturi.
    require_caa: true
    acme:
      contact: mailto:sky@rwx.dev   # passed verbatim as the ACME account contact URI
      profile: classic
      primary: letsencrypt
      cas:
        letsencrypt:
          directory: https://acme-v02.api.letsencrypt.org/directory   # PRODUCTION since 2026-11-23 (staging: https://acme-staging-v02.api.letsencrypt.org/directory)
        gts: {enabled: false}
    dns:
      provider: porkbun
      zone: tun.zip
      credential_file: /run/secrets/theuth-share-edge/dns.json
      target: edge.tun.zip
    # Passthrough Ingresses the edge creates/deletes itself (feature `k8s`, RBAC in rbac.yaml). The HAProxy controller
    # (haproxytech/kubernetes-ingress v3.2.14) maps `*.X` to SNI key `.X` and looks up the SNI exactly, then with its
    # first label cut, so `*.tun.zip` carries `<name>.tun.zip` and each `*.<name>.tun.zip` carries `<label>.<name>.tun.zip`.
    k8s:
      enabled: true
      namespace: theuth-share
      static:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: share-edge-static
            labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
            annotations:
              haproxy.org/ssl-passthrough: "true"
              haproxy.org/send-proxy-protocol: proxy-v2
              haproxy.org/timeout-server: 3600s
              haproxy.org/timeout-tunnel: 3600s
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.tun.zip"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: theuth-share-edge, port: {number: 8443}}}
      per_name:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: share-edge-name-${slug}
            labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
            annotations:
              haproxy.org/ssl-passthrough: "true"
              haproxy.org/send-proxy-protocol: proxy-v2
              haproxy.org/timeout-server: 3600s
              haproxy.org/timeout-tunnel: 3600s
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.${name}.tun.zip"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: theuth-share-edge, port: {number: 8443}}}

# NOT in kustomization.yaml: apply by hand once the owner picks a variant (kubectl -n theuth apply -f <this file>).
#
# Controller on rwx-dev: haproxytech/kubernetes-ingress v3.2.14 (HAProxy 3.2.23), DaemonSet
# haproxy-controller/haproxy-kubernetes-ingress, image digest sha256:d90f628d…f5ae, --ingress.class=haproxy.
# Public 443 → 192.168.8.99:443 (PROXY protocol from 192.168.8.99, ConfigMap `proxy-protocol`).
#
# How its passthrough routes (source, tag v3.2.14):
#   pkg/route/route.go MapRows: an ssl-passthrough Ingress host `*.tun.zip` becomes the key `.tun.zip` of the
#     `sni` map (the `*` is dropped).
#   pkg/handler/https.go sslPassthroughRules: the `ssl` TCP frontend on :443 looks the SNI up exactly, then once
#     more with the first label cut (`req_ssl_sni,regsub(^[^.]*,,),map(sni)`); no match → the TLS-terminating
#     https frontend.
#   https://github.com/haproxytech/kubernetes-ingress/blob/v3.2.14/pkg/handler/https.go#L345-L376
#   https://github.com/haproxytech/kubernetes-ingress/blob/v3.2.14/pkg/route/route.go#L75-L94
# So `sky.tun.zip` → `.tun.zip` matches; `app.sky.tun.zip` → `.sky.tun.zip` does not and lands on the controller's
# own certificate (visitor sees a TLS name error). Design D5 shares are `<label>.<name>.tun.zip`.
#
# ── variant (a): Ingress, one label only (`<name>.tun.zip`, `<name>.tun.zip/<path>`) ─────────────────────────────
# Works with what is installed. Visitor addresses: the edge sees the HAProxy pod's address, not the visitor's
# (the edge has no PROXY-protocol listener yet: `proxy_protocol_in` is not parsed by crates/share-edge), so every
# per-IP limit of §9.4 counts the controller as one client. Acceptable for a closed P0 smoke, not for open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: theuth-share-edge
  labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
  annotations:
    haproxy.org/ssl-passthrough: "true"
    haproxy.org/timeout-server: 3600s
    haproxy.org/timeout-tunnel: "3600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: "*.tun.zip"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: theuth-share-edge
                port:
                  number: 8443
#
# ── variant (b): SNI suffix rule `req_ssl_sni -m end .tun.zip` (multi-label) ──────────────────────────────────────
# There is no controller-level hook for it on the shared :443 in v3.2.14:
#   - `frontend-config-snippet` (controller ConfigMap) goes into the http/https frontends only, not the `ssl` TCP
#     frontend that does passthrough (documentation/annotations.md#frontend-config-snippet); in the https frontend
#     TLS is already terminated. The cluster's snippet is the Coraza SPOE (HTTP rules), which a TCP frontend would
#     reject anyway.
#   - the Frontend CR (`cr-frontend-http|https|stats`) addresses those three frontends only, not `ssl`
#     (documentation/custom-resources.md#frontend).
#   - haproxy-aux.cfg (ConfigMap haproxy-auxiliary) cannot append to a generated frontend.
#   - the TCP CR (ingress.v3.haproxy.org/v3, kind TCP; documentation/custom-resource-tcp.md) gives a whole new TCP
#     frontend with its own acl/use_backend/tcp-request rules, but on its own port, never :443 (the ssl frontend
#     owns it). Its CRD is NOT installed here: `kubectl get crd | grep haproxy` lists only
#     backends.ingress.v1.haproxy.org. Installing tcps.ingress.v3.haproxy.org (crs/definition/ in the controller
#     repo) is a cluster change for the owner.
# The exact TCP CR, for when the owner installs the CRD and routes a public port (or a second public IP's 443) to
# the controller's port 10443 (DaemonSet hostPort or a port on Service haproxy-controller/haproxy-kubernetes-ingress).
# The default backend is the edge; the reject keeps anything not under .tun.zip off it. The controller ConfigMap's
# `proxy-protocol` covers only its own frontends, so add `accept_proxy: true` to the bind if the router sends PROXY.
#
# ---
# apiVersion: ingress.v3.haproxy.org/v3
# kind: TCP
# metadata:
#   name: theuth-share-edge
#   annotations:
#     ingress.class: haproxy
# spec:
#   - name: share-edge-tls
#     frontend:
#       name: fe-share-edge
#       tcplog: true
#       binds:
#         v4:
#           name: v4
#           address: 0.0.0.0
#           port: 10443
#       tcp_request_rule_list:
#         - type: inspect-delay
#           timeout: 5000
#         - type: content
#           action: reject
#           cond: unless
#           cond_test: "{ req_ssl_sni -m end .tun.zip }"
#         - type: content
#           action: accept
#           cond: if
#           cond_test: "{ req_ssl_hello_type 1 }"
#     service:
#       name: theuth-share-edge
#       port: 8443
#
# Owner alternative with neither limit (appendix §8.4 option (a)): its own IP for the edge, i.e. a Service with
# `externalIPs: [<free LAN IP>]` (as haproxy-kubernetes-ingress uses 192.168.8.99) or a NodePort, and the router
# forwarding public 443/tcp + 7850/udp of a second public address to it.

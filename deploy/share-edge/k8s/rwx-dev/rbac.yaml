# The edge (cargo feature `k8s`) creates and deletes its passthrough Ingresses from the `k8s:` templates in
# configmap.yaml: one static `*.tun.zip`, one `*.<name>.tun.zip` per claimed name. Ingresses in `theuth-share` only.
# Verbs are what src/k8s/client.rs calls: server-side apply (`patch`, plus `create` when the object is new),
# `list` by label selector, `delete`; `get` is not called today (read-only, kept). No watch, no update/replace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: theuth-share-edge
  labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: theuth-share-edge
  labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theuth-share-edge
  labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: theuth-share-edge
subjects:
  - kind: ServiceAccount
    name: theuth-share-edge
    namespace: theuth-share

# The rest of deploy/share-edge/config.example.yaml may be added here. No secrets: the DNS credential is the
# Secret `theuth-share-edge` mounted at /run/secrets/theuth-share-edge/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: theuth-share-edge
  labels: {app.kubernetes.io/name: theuth-share-edge, app.kubernetes.io/part-of: theuth}
data:
  config.yaml: |
    domain: tun.zip
    data_dir: /var/lib/theuth-share-edge
    listen: "[::]:8443"
    iroh: {listen: "[::]:7850", relay: https://iroh.relay.theuth.io, public_addrs: []}   # add "<LB IP>:7850"
    admin: {socket: /var/lib/theuth-share-edge/admin.sock, http: "[::]:9090"}
    admission: open
    terms_url: https://example.com/share-terms   # set before launch (§9.5)
    terms_rev: "2026-11-23"
    abuse_url: https://example.com/share-abuse
    abuse_contact: abuse@example.com
    require_caa: true
    acme: {primary: letsencrypt, cas: {gts: {enabled: false}}}   # P1; GTS keys in P2
    dns: {provider: porkbun, zone: tun.zip, credential_file: /run/secrets/theuth-share-edge/dns.json, target: edge.tun.zip}
